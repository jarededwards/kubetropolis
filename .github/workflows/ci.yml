name: ci
on:
  push:
    branches-ignore: [main] # main is covered by pages.yml's own gate
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The layout verifier drives headless Chrome (preinstalled on ubuntu
      # runners) against the built site via the two-slot CDP gate.
      - run: npm run test:layout
