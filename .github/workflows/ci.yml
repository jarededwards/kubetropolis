name: ci
on:
  push:
    branches-ignore: [main] # main is covered by pages.yml's own gate
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The layout verifier drives headless Chrome (preinstalled on ubuntu
      # runners) against the built site via the two-slot CDP gate. Serve the
      # freshly built dist first; SwiftShader on 2-core runners needs a
      # generous first-frame wait.
      - run: |
          npm run preview &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ >/dev/null && break; sleep 1; done
          HUD_WAIT_MS=240000 npm run test:layout
