# Dormant until a remote exists (local-only by product-owner decision).
# Triggers are final: they simply never fire without a hosted repo.
name: ci
on:
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # TODO(M2): npm run test:layout once verify-hud-layout selectors are re-pointed
      - run: npm run build
